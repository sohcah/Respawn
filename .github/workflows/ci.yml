name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
jobs:
  build:
    strategy:
      matrix: 
        os: [ubuntu-latest]
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Test Report
      uses: dorny/test-reporter@v2
      if: always()
      with:
        name: Test Report
        path: artifacts/*.trx
        reporter: dotnet-trx
    - name: Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: artifacts/**/*
  net48:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Test .NET Framework 4.8
      run: dotnet test Respawn.UnitTests/Respawn.UnitTests.csproj --configuration Release --framework net48
